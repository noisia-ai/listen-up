<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check-in | ListenUp! 5.0</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/favicon-32.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0f0e1a;
        --card: #1a1928;
        --border: rgba(255,255,255,0.1);
        --text: #f0f0f8;
        --muted: #82829b;
        --coral: #ee5a6f;
        --blue: #3432e6;
        --green: #22c55e;
        --radius: 12px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        padding: 0;
      }

      /* ── AUTH SCREEN ── */
      #authScreen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px 24px;
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .auth-card h1 { font-size: 1.25rem; margin-bottom: 6px; }
      .auth-card p { font-size: 0.875rem; color: var(--muted); margin-bottom: 24px; }
      .auth-card input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
        margin-bottom: 12px;
        outline: none;
      }
      .auth-card input[type="password"]:focus { border-color: var(--blue); }
      .auth-error {
        font-size: 0.8125rem;
        color: var(--coral);
        margin-bottom: 10px;
        min-height: 18px;
      }

      /* ── APP SCREEN ── */
      #appScreen { display: none; }

      .app-header {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        padding: 16px 16px 0;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .app-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .app-title { font-size: 1rem; font-weight: 700; }
      .app-counter { font-size: 0.8125rem; color: var(--muted); }
      .search-wrap { padding-bottom: 12px; }
      .search-wrap input[type="search"] {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }
      .search-wrap input[type="search"]:focus { border-color: var(--blue); }
      .search-wrap input[type="search"]::placeholder { color: var(--muted); }

      /* ── LIST ── */
      #resultsList {
        list-style: none;
        padding: 8px 0 100px;
      }
      .attendee-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .attendee-info { flex: 1; min-width: 0; }
      .attendee-name {
        font-size: 0.9375rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .attendee-meta {
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .checkin-btn {
        flex-shrink: 0;
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        font-size: 0.8125rem;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .checkin-btn:disabled { opacity: 0.5; cursor: default; }
      .checkin-btn--pending { background: var(--coral); color: #fff; }
      .checkin-btn--done {
        background: transparent;
        border: 1px solid var(--green);
        color: var(--green);
      }

      #statusMsg {
        padding: 48px 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9375rem;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 15px;
        border-radius: var(--radius);
        border: none;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: var(--blue);
        color: #fff;
        transition: opacity 0.15s;
      }
      .btn:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>

    <!-- ── AUTH ── -->
    <div id="authScreen">
      <div class="auth-card">
        <h1>Check-in ListenUp! 5.0</h1>
        <p>Ingresa el código de acceso para continuar.</p>
        <input type="password" id="tokenInput" placeholder="Código de acceso" autocomplete="current-password" />
        <div class="auth-error" id="authError"></div>
        <button class="btn" id="authBtn">Entrar</button>
      </div>
    </div>

    <!-- ── APP ── -->
    <div id="appScreen">
      <header class="app-header">
        <div class="app-header-top">
          <span class="app-title">Check-in · ListenUp! 5.0</span>
          <span class="app-counter" id="counterEl"></span>
        </div>
        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="Buscar por nombre…" autocomplete="off" autocorrect="off" spellcheck="false" />
        </div>
      </header>

      <div id="statusMsg">Cargando asistentes…</div>
      <ul id="resultsList" hidden></ul>
    </div>

    <script src="/eventos/listenup-5-0/checkin/checkin.js"></script>
  </body>
</html>
